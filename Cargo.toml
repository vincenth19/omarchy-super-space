[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ss-core = { path = "crates/core" }
ss-files = { path = "crates/files" }
ss-media = { path = "crates/media" }
ss-sources = { path = "crates/sources" }
ss-answers = { path = "crates/answers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
